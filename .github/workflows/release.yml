name: Build release zip
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: bash tools/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: open-bunq-payments
          path: dist/*.zip
