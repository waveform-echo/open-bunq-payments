name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: PHP syntax
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Smoke
        run: php tests/smoke.php

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check assets/js/wc-blocks.js
      - run: node --check assets/js/surecart.js

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Source manifest
        run: sha256sum -c SOURCE_MANIFEST.sha256
      - name: Secret scanner self-test
        run: python3 tools/secret_scan.py --self-test
      - name: Secret scan - current tree
        run: python3 tools/secret_scan.py --tree .
      - name: Secret scan - git history
        shell: bash
        run: |
          set -o pipefail
          git log --all --full-history -p --no-ext-diff --no-renames | \
            python3 tools/secret_scan.py --stdin --label git-history
